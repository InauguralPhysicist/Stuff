name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lean:
    name: Lean certificates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: lake update

      - name: Fetch mathlib cache
        run: lake exe cache get

      - name: Build certificates
        run: lake build KellerCerts

      - name: Audit axioms
        run: lake build AxiomCheck

  python:
    name: Python suite (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile keller_quantization.py

      - name: CLI sanity
        run: python keller_quantization.py --help
